name: Build

on:
  push:
    branches: [ develop ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          clean: ${{ github.ref == 'refs/heads/develop' }}

      - name: Build setup
        uses: ./.github/actions/build-setup

      - name: Validate ABI
        run: ./gradlew :library:checkKotlinAbi

      - name: Compile & run tests
        run: >
          ./gradlew kotlinUpgradeYarnLock
          :library:desktopTest
          :demo:desktop:compileKotlinDesktop
          :demo:web:compileKotlinJs
          :demo:web:compileKotlinWasmJs

      - name: Publish unit test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Unit test report
          require_tests: true
          report_paths: "**/build/test-results/**/TEST-*.xml"

      - name: Generate coverage report
        if: github.event_name == 'pull_request'
        run: ./gradlew :library:koverXmlReport

      - name: Publish coverage report
        if: github.event_name == 'pull_request'
        uses: mi-kas/kover-report@v2
        with:
          path: library/build/reports/kover/report.xml
          title: Code coverage
          update-comment: true
          coverage-counter-type: LINE
          min-coverage-overall: 30
          min-coverage-changed-files: 50